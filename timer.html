<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Time Calculator">
<title>QAS — Time Calculator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
–navy:    #1a2d4f;
–navy2:   #243a63;
–navy3:   #1e3356;
–blue:    #2e6db4;
–blue2:   #4a8fd4;
–steel:   #5b8db8;
–light:   #d6e8f7;
–lighter: #eaf3fb;
–white:   #ffffff;
–border:  #2e5080;
–border2: #c8dff0;
–text:    #ffffff;
–text2:   #a8c8e8;
–text3:   #7aa8cc;
–success: #2ec49a;
–warn:    #e07b4a;
–radius:  14px;
–radius-sm: 8px;
}

html, body {
height: 100%;
font-family: -apple-system, ‘Segoe UI’, Arial, sans-serif;
background: var(–navy);
color: var(–text);
overflow: hidden;
}

/* ── Layout ── */
.page {
display: flex;
flex-direction: column;
height: 100vh;
height: -webkit-fill-available;
max-width: 480px;
margin: 0 auto;
border-left: 1px solid rgba(46,109,180,0.3);
border-right: 1px solid rgba(46,109,180,0.3);
background: linear-gradient(180deg, #1a2d4f 0%, #152340 100%);
}

/* ── Header ── */
.header {
background: linear-gradient(135deg, #1e3356 0%, #1a2d4f 100%);
border-bottom: 1px solid var(–border);
padding: 18px 20px 14px;
text-align: center;
flex-shrink: 0;
}

.logo-wrap {
display: flex;
align-items: center;
justify-content: center;
gap: 14px;
margin-bottom: 6px;
}

/* SVG Logo — built inline so no external load needed */
.logo-svg {
width: 52px;
height: 52px;
flex-shrink: 0;
}

.logo-text h1 {
font-size: 22px;
font-weight: 800;
color: var(–white);
letter-spacing: 1px;
line-height: 1;
}
.logo-text h1 span { color: var(–blue2); }
.logo-text p {
font-size: 11px;
color: var(–text2);
letter-spacing: 2px;
text-transform: uppercase;
margin-top: 2px;
}

.app-subtitle {
font-size: 12px;
color: var(–text3);
letter-spacing: 1px;
}

/* ── Two-column body ── */
.body {
display: flex;
flex: 1;
overflow: hidden;
gap: 0;
}

/* LEFT — Input panel */
.panel-input {
width: 52%;
border-left: 1px solid var(–border);
display: flex;
flex-direction: column;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
scrollbar-width: none;
}
.panel-input::-webkit-scrollbar { display: none; }

/* RIGHT — Result panel */
.panel-result {
flex: 1;
display: flex;
flex-direction: column;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
scrollbar-width: none;
background: rgba(0,0,0,0.12);
}
.panel-result::-webkit-scrollbar { display: none; }

/* ── Panel headers ── */
.panel-head {
padding: 12px 14px 10px;
font-size: 10px;
font-weight: 700;
letter-spacing: 2px;
text-transform: uppercase;
color: var(–text3);
border-bottom: 1px solid rgba(46,80,128,0.5);
background: rgba(0,0,0,0.1);
flex-shrink: 0;
display: flex;
align-items: center;
gap: 6px;
}
.panel-head .dot {
width: 6px; height: 6px;
border-radius: 50%;
background: var(–blue2);
}

/* ── Input content ── */
.input-body {
padding: 14px 12px;
display: flex;
flex-direction: column;
gap: 14px;
}

.field-label {
font-size: 10px;
font-weight: 700;
letter-spacing: 1.5px;
text-transform: uppercase;
color: var(–text3);
margin-bottom: 6px;
}

/* Source toggle */
.src-toggle {
display: flex;
border-radius: var(–radius-sm);
overflow: hidden;
border: 1px solid var(–border);
margin-bottom: 7px;
}
.src-btn {
flex: 1;
padding: 7px 4px;
font-size: 11px;
font-family: inherit;
border: none;
background: var(–navy2);
color: var(–text2);
cursor: pointer;
transition: all 0.2s;
text-align: center;
}
.src-btn:first-child { border-left: none; }
.src-btn.active {
background: var(–blue);
color: #fff;
font-weight: 600;
}

/* Date/time input */
.dt-input {
width: 100%;
padding: 10px 10px;
border-radius: var(–radius-sm);
border: 1px solid var(–border);
background: var(–navy2);
color: var(–text);
font-family: inherit;
font-size: 13px;
outline: none;
transition: border-color 0.2s;
direction: ltr;
text-align: left;
-webkit-appearance: none;
appearance: none;
}
.dt-input:focus { border-color: var(–blue2); }
.dt-input::-webkit-calendar-picker-indicator { filter: invert(0.7) sepia(0.3) hue-rotate(185deg); }

/* Separator */
.sep {
display: flex;
align-items: center;
gap: 8px;
font-size: 10px;
color: var(–text3);
letter-spacing: 1px;
}
.sep::before, .sep::after {
content: ‘’;
flex: 1;
height: 1px;
background: var(–border);
opacity: 0.6;
}

/* Buttons */
.btn-calc {
width: 100%;
padding: 13px;
border-radius: var(–radius-sm);
border: none;
background: linear-gradient(135deg, var(–blue) 0%, #1e5a9e 100%);
color: #fff;
font-family: inherit;
font-size: 14px;
font-weight: 700;
cursor: pointer;
transition: all 0.2s;
box-shadow: 0 3px 14px rgba(46,109,180,0.4);
letter-spacing: 0.5px;
}
.btn-calc:active { transform: scale(0.97); }

.btn-clear {
width: 100%;
padding: 10px;
border-radius: var(–radius-sm);
border: 1px solid var(–border);
background: transparent;
color: var(–text3);
font-family: inherit;
font-size: 12px;
cursor: pointer;
transition: all 0.2s;
letter-spacing: 0.5px;
}
.btn-clear:active { background: rgba(255,255,255,0.05); }

/* Error */
.err-msg {
font-size: 11px;
color: var(–warn);
padding: 7px 10px;
background: rgba(224,123,74,0.1);
border: 1px solid rgba(224,123,74,0.25);
border-radius: var(–radius-sm);
display: none;
text-align: center;
}
.err-msg.show { display: block; }

/* ── Result panel content ── */
.result-body {
padding: 14px 12px;
display: flex;
flex-direction: column;
gap: 10px;
}

/* Empty state */
.empty-state {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
height: 100%;
padding: 20px;
text-align: center;
opacity: 0.4;
}
.empty-icon { font-size: 36px; margin-bottom: 10px; }
.empty-text { font-size: 12px; color: var(–text3); line-height: 1.6; }

/* Result status badge */
.status-badge {
display: inline-flex;
align-items: center;
gap: 5px;
padding: 5px 12px;
border-radius: 20px;
font-size: 11px;
font-weight: 700;
letter-spacing: 1px;
text-transform: uppercase;
align-self: center;
}
.status-badge.future { background: rgba(46,196,154,0.15); color: var(–success); border: 1px solid rgba(46,196,154,0.3); }
.status-badge.past   { background: rgba(224,123,74,0.15);  color: var(–warn);    border: 1px solid rgba(224,123,74,0.3); }
.status-badge.neutral{ background: rgba(74,143,212,0.15);  color: var(–blue2);   border: 1px solid rgba(74,143,212,0.3); }

/* Live countdown */
.live-box {
background: linear-gradient(135deg, rgba(46,109,180,0.2), rgba(30,83,158,0.15));
border: 1px solid rgba(74,143,212,0.35);
border-radius: var(–radius-sm);
padding: 14px 10px;
text-align: center;
}
.live-num {
font-size: 28px;
font-weight: 800;
letter-spacing: 3px;
color: var(–white);
direction: ltr;
font-variant-numeric: tabular-nums;
line-height: 1;
}
.live-lbl {
font-size: 10px;
color: var(–text3);
margin-top: 5px;
letter-spacing: 1.5px;
text-transform: uppercase;
display: flex;
align-items: center;
justify-content: center;
gap: 5px;
}
.live-dot {
width: 6px; height: 6px;
border-radius: 50%;
background: var(–success);
animation: blink 1.4s infinite;
}
@keyframes blink {
0%,100% { opacity: 1; }
50%      { opacity: 0.2; }
}

/* Stats grid */
.stats-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 7px;
}
.stat-item {
background: var(–navy2);
border: 1px solid var(–border);
border-radius: var(–radius-sm);
padding: 10px 8px;
text-align: center;
}
.stat-item.main {
background: linear-gradient(135deg, rgba(46,109,180,0.25), rgba(30,83,158,0.2));
border-color: var(–blue);
}
.stat-num {
font-size: 24px;
font-weight: 800;
color: var(–white);
line-height: 1;
direction: ltr;
}
.stat-item.main .stat-num { color: var(–blue2); }
.stat-lbl {
font-size: 10px;
color: var(–text3);
margin-top: 3px;
letter-spacing: 0.5px;
}

/* Summary */
.summary-box {
background: rgba(0,0,0,0.15);
border: 1px solid rgba(46,80,128,0.4);
border-radius: var(–radius-sm);
padding: 10px 12px;
font-size: 12px;
color: var(–text2);
line-height: 1.7;
text-align: center;
}
.summary-box strong { color: var(–white); }

/* Slide in animation */
@keyframes fadeIn {
from { opacity: 0; transform: translateY(6px); }
to   { opacity: 1; transform: translateY(0); }
}
.anim { animation: fadeIn 0.3s ease; }

.hidden { display: none !important; }
</style>

</head>

<script>
// ── State ──
let srcStart = 'custom';
let srcEnd   = 'custom';
let liveTimer = null;

// ── Source toggle ──
function setSrc(which, type) {
  if (which === 'start') {
    srcStart = type;
    document.getElementById('s-custom').classList.toggle('active', type === 'custom');
    document.getElementById('s-now').classList.toggle('active',    type === 'now');
    document.getElementById('s-wrap').classList.toggle('hidden',   type === 'now');
  } else {
    srcEnd = type;
    document.getElementById('e-custom').classList.toggle('active', type === 'custom');
    document.getElementById('e-now').classList.toggle('active',    type === 'now');
    document.getElementById('e-wrap').classList.toggle('hidden',   type === 'now');
  }
}

// ── Helpers ──
function pad(n) { return String(Math.abs(n)).padStart(2,'0'); }

function parseDiff(ms) {
  const abs = Math.abs(ms);
  const totalSec  = Math.floor(abs / 1000);
  const totalMin  = Math.floor(totalSec / 60);
  const totalHrs  = Math.floor(totalMin / 60);
  const totalDays = Math.floor(totalHrs / 24);
  const weeks     = Math.floor(totalDays / 7);
  const months    = Math.floor(totalDays / 30.4375);
  const secs = totalSec % 60;
  const mins = totalMin % 60;
  const hrs  = totalHrs % 24;
  return { totalSec, totalMin, totalHrs, totalDays, weeks, months, secs, mins, hrs };
}

function showErr(msg) {
  const el = document.getElementById('p-err');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

function renderResult(html) {
  document.getElementById('empty-state').classList.add('hidden');
  const rb = document.getElementById('result-body');
  rb.innerHTML = html;
  rb.classList.remove('hidden');
  rb.classList.add('anim');
  setTimeout(() => rb.classList.remove('anim'), 400);
}

// ── Calculate ──
function calc() {
  clearInterval(liveTimer);
  const now = new Date();

  let t1 = srcStart === 'now' ? now : new Date(document.getElementById('p-start').value);
  let t2 = srcEnd   === 'now' ? now : new Date(document.getElementById('p-end').value);

  if (!t1 || isNaN(t1)) { showErr('حدد وقت البداية'); return; }
  if (!t2 || isNaN(t2)) { showErr('حدد وقت النهاية'); return; }
  document.getElementById('p-err').classList.remove('show');

  function render() {
    // refresh 'now' sources each tick
    const n = new Date();
    const start = srcStart === 'now' ? n : t1;
    const end   = srcEnd   === 'now' ? n : t2;
    const diff  = end - start;
    const isPast   = diff < 0;
    const isLive   = srcStart === 'now' || srcEnd === 'now';
    const d        = parseDiff(diff);

    const badge = isPast
      ? `<span class="status-badge past">في الماضي</span>`
      : `<span class="status-badge future">في المستقبل</span>`;

    const liveBox = isLive ? `
      <div class="live-box">
        <div class="live-num">${pad(d.totalHrs)}:${pad(d.mins)}:${pad(d.secs)}</div>
        <div class="live-lbl"><span class="live-dot"></span>${isPast ? 'مرّ' : 'متبقي'} (مباشر)</div>
      </div>` : '';

    const html = `
      ${badge}
      ${liveBox}
      <div class="stats-grid">
        <div class="stat-item main">
          <div class="stat-num">${d.totalDays}</div>
          <div class="stat-lbl">يوم</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">${d.totalHrs}</div>
          <div class="stat-lbl">ساعة</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">${d.totalMin}</div>
          <div class="stat-lbl">دقيقة</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">${d.weeks}</div>
          <div class="stat-lbl">أسبوع</div>
        </div>
      </div>
      <div class="summary-box">
        ${isPast ? 'مرّ' : 'يتبقى'}
        <strong>${d.totalDays}</strong> يوم و
        <strong>${d.hrs}</strong> ساعة و
        <strong>${d.mins}</strong> دقيقة
        ${d.months > 0 ? `<br>≈ <strong>${d.months}</strong> شهر` : ''}
      </div>
    `;

    renderResult(html);
  }

  render();
  if (srcStart === 'now' || srcEnd === 'now') {
    liveTimer = setInterval(render, 1000);
  }
}

// ── Clear ──
function clearAll() {
  clearInterval(liveTimer);
  liveTimer = null;

  // Reset sources
  setSrc('start','custom');
  setSrc('end','custom');

  // Reset inputs to now
  const now = new Date();
  const p2 = n => String(n).padStart(2,'0');
  const dt = `${now.getFullYear()}-${p2(now.getMonth()+1)}-${p2(now.getDate())}T${p2(now.getHours())}:${p2(now.getMinutes())}`;
  document.getElementById('p-start').value = dt;
  document.getElementById('p-end').value   = dt;

  // Show empty state
  document.getElementById('result-body').classList.add('hidden');
  document.getElementById('empty-state').classList.remove('hidden');
  document.getElementById('p-err').classList.remove('show');
}

// ── Init ──
(function(){
  const now = new Date();
  const p2 = n => String(n).padStart(2,'0');
  const dt = `${now.getFullYear()}-${p2(now.getMonth()+1)}-${p2(now.getDate())}T${p2(now.getHours())}:${p2(now.getMinutes())}`;
  document.getElementById('p-start').value = dt;
  document.getElementById('p-end').value   = dt;
})();
</script>
