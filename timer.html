<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Time Calculator">
<title>QAS — Time Calculator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --navy:    #0f2040;
  --navy2:   #162e56;
  --navy3:   #1c3a6b;
  --blue:    #1e6fbe;
  --blue-lt: #3b8fd4;
  --teal:    #17a589;
  --white:   #ffffff;
  --off:     #c8dff5;
  --muted:   #7da4cc;
  --bdr:     rgba(255,255,255,0.13);
  --bdr2:    rgba(255,255,255,0.07);
  --danger:  #e05a3a;
  --r:  10px;
  --rs: 7px;
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--navy);
  color: var(--white);
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: -webkit-fill-available;
}

/* ── PAGE ───────────────────────────── */
.page {
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  height: 100%;
  border-left:  1px solid var(--bdr2);
  border-right: 1px solid var(--bdr2);
}

/* ── HEADER ─────────────────────────── */
.hdr {
  flex-shrink: 0;
  background: var(--navy2);
  border-bottom: 1px solid var(--bdr);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-img {
  height: 44px;
  width: 44px;
  object-fit: contain;
  border-radius: 8px;
  flex-shrink: 0;
  background: transparent;
}

.hdr-text { flex: 1; min-width: 0; }
.hdr-name {
  font-size: 16px;
  font-weight: 800;
  color: var(--white);
  letter-spacing: 0.5px;
  white-space: nowrap;
}
.hdr-name span { color: var(--blue-lt); }
.hdr-sub {
  font-size: 10px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: 2px;
}

/* ── SPLIT BODY ─────────────────────── */
.split {
  flex: 1;
  display: flex;
  min-height: 0;
  overflow: hidden;
}

/* ── PANELS ─────────────────────────── */
.panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.p-left {
  width: 50%;
  background: var(--navy2);
  border-left: 1px solid var(--bdr);
}
.p-right {
  flex: 1;
  background: var(--navy);
}

.p-head {
  flex-shrink: 0;
  padding: 8px 12px;
  background: rgba(0,0,0,0.22);
  border-bottom: 1px solid var(--bdr2);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.pip { width:6px; height:6px; border-radius:50%; background:var(--blue-lt); flex-shrink:0; }
.pip.g { background: var(--teal); }

.p-body {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 13px 11px;
  display: flex;
  flex-direction: column;
  gap: 11px;
}
.p-body::-webkit-scrollbar { display: none; }

/* ── FIELD ───────────────────────────── */
.flbl {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1.3px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 5px;
}

/* Source toggle */
.tog {
  display: flex;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--bdr);
  border-radius: var(--rs);
  overflow: hidden;
  margin-bottom: 6px;
}
.tb {
  flex: 1;
  padding: 7px 2px;
  font-size: 11px;
  font-weight: 600;
  font-family: inherit;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: background .15s, color .15s;
  text-align: center;
  line-height: 1;
}
.tb.on {
  background: var(--blue);
  color: #fff;
  border-radius: calc(var(--rs) - 1px);
}

/* datetime input */
.dti {
  width: 100%;
  padding: 8px 9px;
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: var(--rs);
  color: #fff;
  font-size: 11px;
  font-family: inherit;
  outline: none;
  direction: ltr;
  text-align: left;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color .15s;
}
.dti:focus { border-color: var(--blue-lt); }
.dti::-webkit-calendar-picker-indicator {
  filter: invert(1) opacity(.5);
  cursor: pointer;
}

/* separator */
.sep {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--muted);
}
.sep::before, .sep::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--bdr);
}

/* Buttons */
.b-go {
  width: 100%;
  padding: 11px 8px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: var(--rs);
  font-size: 13px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  letter-spacing: 0.3px;
  box-shadow: 0 2px 10px rgba(30,111,190,.5);
  transition: transform .1s, background .15s;
}
.b-go:active { transform: scale(.97); background: #1760a8; }

.b-clr {
  width: 100%;
  padding: 8px;
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--bdr);
  border-radius: var(--rs);
  font-size: 11px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: color .15s, background .15s;
}
.b-clr:active { color: #fff; background: rgba(255,255,255,.06); }

.err {
  font-size: 11px;
  font-weight: 600;
  color: var(--danger);
  background: rgba(224,90,58,.12);
  border: 1px solid rgba(224,90,58,.3);
  border-radius: var(--rs);
  padding: 7px 8px;
  text-align: center;
  display: none;
}
.err.show { display: block; }

/* ── RESULT PANEL ─────────────────── */
.empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 20px;
  text-align: center;
  opacity: .32;
}
.empty-icon { font-size: 32px; }
.empty-txt { font-size: 11px; color: var(--muted); line-height: 1.7; }

.r-body {
  display: none;
  flex-direction: column;
  gap: 9px;
  padding: 13px 11px;
}
.r-body.show { display: flex; }

/* badge */
.bdg {
  align-self: center;
  padding: 4px 13px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.bdg.fut { background: rgba(23,165,137,.18); color:#2ecc9a; border:1px solid rgba(23,165,137,.35); }
.bdg.pst { background: rgba(224,90,58,.15);  color:#f07a5a; border:1px solid rgba(224,90,58,.3); }
.bdg.neu { background: rgba(59,143,212,.15); color:var(--blue-lt); border:1px solid rgba(59,143,212,.3); }

/* live */
.live-box {
  background: rgba(30,111,190,.15);
  border: 1px solid rgba(59,143,212,.3);
  border-radius: var(--r);
  padding: 12px 8px;
  text-align: center;
}
.live-num {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: 3px;
  color: #fff;
  direction: ltr;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.live-tag {
  margin-top: 5px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}
.blk { width:5px; height:5px; border-radius:50%; background:var(--teal); animation: bk 1.3s infinite; }
@keyframes bk { 0%,100%{opacity:1} 50%{opacity:.15} }

/* grid */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.cell {
  background: var(--navy2);
  border: 1px solid var(--bdr);
  border-radius: var(--rs);
  padding: 9px 5px;
  text-align: center;
}
.cell.hi {
  background: rgba(30,111,190,.22);
  border-color: rgba(59,143,212,.45);
}
.cn {
  font-size: 24px;
  font-weight: 800;
  color: #fff;
  line-height: 1;
  direction: ltr;
}
.cell.hi .cn { color: var(--blue-lt); }
.cl {
  font-size: 9px;
  font-weight: 600;
  color: var(--muted);
  margin-top: 3px;
  letter-spacing: .5px;
}

/* summary */
.summ {
  background: rgba(0,0,0,.2);
  border: 1px solid var(--bdr2);
  border-radius: var(--rs);
  padding: 9px 11px;
  font-size: 11px;
  font-weight: 500;
  color: var(--off);
  line-height: 1.85;
  text-align: center;
}
.summ strong { color: #fff; font-weight: 700; }

@keyframes up { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.anim { animation: up .25s ease; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="hdr">
    <img class="logo-img"
         src="https://raw.githubusercontent.com/placeholder/placeholder/main/logo.png"
         onerror="this.style.display='none'"
         alt="QAS">
    <div class="hdr-text">
      <div class="hdr-name">Q<span>A</span>S Analytics</div>
      <div class="hdr-sub">Time Calculator</div>
    </div>
  </div>

  <!-- SPLIT -->
  <div class="split">

    <!-- LEFT INPUT -->
    <div class="panel p-left">
      <div class="p-head"><span class="pip"></span>الإدخال</div>
      <div class="p-body">

        <div>
          <div class="flbl">🟢 البداية</div>
          <div class="tog">
            <button class="tb on" id="sc" onclick="src('s','c')">تحديد</button>
            <button class="tb"    id="sn" onclick="src('s','n')">الآن↙</button>
          </div>
          <div id="sw"><input class="dti" type="datetime-local" id="ts"></div>
        </div>

        <div class="sep">إلى</div>

        <div>
          <div class="flbl">🔴 النهاية</div>
          <div class="tog">
            <button class="tb on" id="ec" onclick="src('e','c')">تحديد</button>
            <button class="tb"    id="en" onclick="src('e','n')">الآن↙</button>
          </div>
          <div id="ew"><input class="dti" type="datetime-local" id="te"></div>
        </div>

        <div class="err" id="er">الرجاء تحديد الأوقات</div>
        <button class="b-go" onclick="go()">▶ احسب</button>
        <button class="b-clr" onclick="rst()">✕ مسح</button>

      </div>
    </div>

    <!-- RIGHT RESULT -->
    <div class="panel p-right">
      <div class="p-head"><span class="pip g"></span>النتيجة</div>

      <div class="empty" id="emp">
        <div class="empty-icon">⏱</div>
        <div class="empty-txt">حدد وقتين<br>ثم اضغط احسب</div>
      </div>

      <div class="r-body" id="rb"></div>
    </div>

  </div>
</div>

<script>
let ss='c', es='c', tmr=null;

function src(w,t){
  if(w==='s'){ss=t;tog('sc','sn',t);document.getElementById('sw').classList.toggle('hidden',t==='n');}
  else       {es=t;tog('ec','en',t);document.getElementById('ew').classList.toggle('hidden',t==='n');}
}
function tog(a,b,t){
  document.getElementById(a).classList.toggle('on',t==='c');
  document.getElementById(b).classList.toggle('on',t==='n');
}

function p2(n){return String(Math.abs(n)).padStart(2,'0');}

function parse(ms){
  const a=Math.abs(ms);
  const ts=Math.floor(a/1000), tm=Math.floor(ts/60),
        th=Math.floor(tm/60),  td=Math.floor(th/24);
  return {ts,tm,th,td,
    weeks:Math.floor(td/7),
    months:Math.floor(td/30.4375),
    secs:ts%60, mins:tm%60, hrs:th%24};
}

function go(){
  clearInterval(tmr);
  const now=new Date();
  const v1=document.getElementById('ts').value;
  const v2=document.getElementById('te').value;
  let t1=ss==='n'?now:(v1?new Date(v1):null);
  let t2=es==='n'?now:(v2?new Date(v2):null);
  if(!t1||isNaN(t1)){err('حدد وقت البداية');return;}
  if(!t2||isNaN(t2)){err('حدد وقت النهاية');return;}
  document.getElementById('er').classList.remove('show');
  const live=ss==='n'||es==='n';

  function rnd(){
    const n=new Date();
    const a=ss==='n'?n:t1, b=es==='n'?n:t2;
    const df=b-a, past=df<0, d=parse(df);

    const badge=past
      ?`<div class="bdg pst">في الماضي</div>`
      :`<div class="bdg fut">في المستقبل</div>`;

    const liveH=live?`
      <div class="live-box">
        <div class="live-num">${p2(d.th)}:${p2(d.mins)}:${p2(d.secs)}</div>
        <div class="live-tag"><span class="blk"></span>${past?'مرّ':'متبقي'} — مباشر</div>
      </div>`:'';

    const html=`
      ${badge}${liveH}
      <div class="grid">
        <div class="cell hi"><div class="cn">${d.td}</div><div class="cl">يوم</div></div>
        <div class="cell">   <div class="cn">${d.th}</div><div class="cl">ساعة</div></div>
        <div class="cell">   <div class="cn">${d.tm}</div><div class="cl">دقيقة</div></div>
        <div class="cell">   <div class="cn">${d.weeks}</div><div class="cl">أسبوع</div></div>
      </div>
      <div class="summ">
        ${past?'مرّ':'يتبقى'}
        <strong>${d.td}</strong> يوم و
        <strong>${d.hrs}</strong> ساعة و
        <strong>${d.mins}</strong> دقيقة
        ${d.months>0?`<br>≈ <strong>${d.months}</strong> شهر`:''}
      </div>`;

    document.getElementById('emp').style.display='none';
    const rb=document.getElementById('rb');
    rb.innerHTML=html;
    rb.classList.add('show','anim');
    setTimeout(()=>rb.classList.remove('anim'),300);
  }

  rnd();
  if(live) tmr=setInterval(rnd,1000);
}

function err(m){
  const e=document.getElementById('er');
  e.textContent=m; e.classList.add('show');
  setTimeout(()=>e.classList.remove('show'),3000);
}

function rst(){
  clearInterval(tmr); tmr=null;
  src('s','c'); src('e','c');
  const now=new Date();
  const dt=`${now.getFullYear()}-${p2(now.getMonth()+1)}-${p2(now.getDate())}T${p2(now.getHours())}:${p2(now.getMinutes())}`;
  document.getElementById('ts').value=dt;
  document.getElementById('te').value=dt;
  document.getElementById('rb').classList.remove('show');
  document.getElementById('emp').style.display='';
  document.getElementById('er').classList.remove('show');
}

(function(){
  const now=new Date();
  const dt=`${now.getFullYear()}-${p2(now.getMonth()+1)}-${p2(now.getDate())}T${p2(now.getHours())}:${p2(now.getMinutes())}`;
  document.getElementById('ts').value=dt;
  document.getElementById('te').value=dt;
})();
</script>

</body>
</html>
