<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الكروت المتشابهة المحدثة</title>
    <style>
        :root {
            --primary-color: #4a5568;
            --bg-color: #f7fafc;
            --card-back: #2d3748;
            --card-front: #ffffff;
            --matched-bg: #8b5cf6; /* اللون البنفسجي المودرن للكروت المتطابقة */
            --matched-text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--primary-color);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 2.5rem;
            color: #1a202c;
        }

        .game-status {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        /* حاوية اللعبة */
        .game-container {
            display: grid;
            gap: 15px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            perspective: 1000px;
        }

        /* تصميم الكرت */
        .card {
            aspect-ratio: 1;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            transform: rotateY(180deg);
            cursor: default;
            pointer-events: none;
        }

        /* تغيير خلفية وجه الكرت عند التطابق للون البنفسجي */
        .card.matched .card-front {
            background-color: var(--matched-bg) !important;
            color: var(--matched-text) !important;
            border-color: #7c3aed;
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.05); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        /* ظهر الكرت */
        .card-back {
            background-color: var(--card-back);
            color: white;
            border: 2px solid #4a5568;
        }

        .card-back::after {
            content: "؟";
            font-size: 2rem;
            font-weight: bold;
            opacity: 0.4;
        }

        /* وجه الكرت (تم تكبير حجم الرمز إلى 3.2rem ليكون واضحاً جداً) */
        .card-front {
            background-color: var(--card-front);
            transform: rotateY(180deg);
            border: 2px solid #e2e8f0;
            font-size: 3.2rem; 
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* نافذة الفوز */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            background: white;
            padding: 30px 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 80%;
        }

        button {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
        }

        button:hover {
            background-color: #2b6cb0;
        }
    </style>
</head>
<body>

    <header>
        <h1>لعبة تطابق الكروت</h1>
        <div class="game-status" id="stage-display">المرحلة: 1 / 5</div>
    </header>

    <div class="game-container" id="game-board"></div>

    <div class="modal" id="win-modal">
        <div class="modal-content">
            <h2 id="modal-title">أحسنت!</h2>
            <p id="modal-message">تم اجتياز المرحلة بنجاح.</p>
            <button id="next-stage-btn" onclick="nextStage()">المرحلة التالية</button>
        </div>
    </div>

    <script>
        // مسبح الرموز المتنوعة
        const itemPool = [
            '🦁', '🦊', '🐱', '🐼', '🐨', '🐰', '🐯', '🐸', '🐵', '🦉',
            'A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'M', 'N',
            '1', '2', '3', '4', '5', '6', '7', '8', '9', '0'
        ];

        // إعدادات المراحل الخمسة (تم تعديل الأولى إلى 8 كروت لتصبح زوجية)
        const stages = [
            { id: 1, cardsCount: 8, columns: 4 },
            { id: 2, cardsCount: 12, columns: 4 },
            { id: 3, cardsCount: 20, columns: 5 },
            { id: 4, cardsCount: 26, columns: 6 },
            { id: 5, cardsCount: 30, columns: 6 }
        ];

        let currentStageIndex = 0;
        let flippedCards = [];
        let lockBoard = false;
        let matchedCount = 0;
        let totalPairs = 0;

        const gameBoard = document.getElementById('game-board');
        const stageDisplay = document.getElementById('stage-display');
        const winModal = document.getElementById('win-modal');

        // سياق الصوت التلقائي لإنشاء النغمات دون ملفات خارجية
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // دالة لتوليد نغمات مخصصة
        function playTone(freq, type, duration, startTime = 0) {
            initAudio();
            if (!audioCtx) return;

            setTimeout(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.value = freq;
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                // تأثير خفوت تدريجي للصوت لمنع الخشونة
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            }, startTime * 1000);
        }

        // نغمة الإجابة الصحيحة (نغمتين سريعتين متصاعدتين)
        function playMatchSound() {
            playTone(523.25, 'sine', 0.15, 0);    // نغمة C5
            playTone(659.25, 'sine', 0.25, 0.08); // نغمة E5
        }

        // نغمة الفوز واكتمال المرحلة (معزوفة تصاعدية احتفالية)
        function playWinSound() {
            playTone(523.25, 'triangle', 0.15, 0);    // C5
            playTone(587.33, 'triangle', 0.15, 0.1);  // D5
            playTone(659.25, 'triangle', 0.15, 0.2);  // E5
            playTone(783.99, 'triangle', 0.4, 0.3);   // G5
        }

        // بدء اللعبة
        initGame();

        function initGame() {
            const currentStage = stages[currentStageIndex];
            stageDisplay.textContent = `المرحلة: ${currentStage.id} / 5`;
            
            gameBoard.style.gridTemplateColumns = `repeat(${currentStage.columns}, 1fr)`;
            gameBoard.innerHTML = '';
            
            flippedCards = [];
            lockBoard = false;
            matchedCount = 0;

            const stageItems = generateStageItems(currentStage.cardsCount);
            
            stageItems.forEach((item, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.value = item;
                card.dataset.index = index;

                card.innerHTML = `
                    <div class="card-face card-back"></div>
                    <div class="card-front card-face">${item}</div>
                `;

                card.addEventListener('click', flipCard);
                gameBoard.appendChild(card);
            });
        }

        function generateStageItems(count) {
            totalPairs = count / 2; 

            const shuffledPool = [...itemPool].sort(() => 0.5 - Math.random());
            const selectedItems = shuffledPool.slice(0, totalPairs);

            let stageItems = [...selectedItems, ...selectedItems];
            return stageItems.sort(() => 0.5 - Math.random());
        }

        function flipCard() {
            // تفعيل نظام الصوت عند أول تفاعل للمستخدم (سياسة المتصفحات الحديثة)
            initAudio(); 

            if (lockBoard) return;
            if (this.classList.contains('flipped') || this.classList.contains('matched')) return;

            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            lockBoard = true;
            const [card1, card2] = flippedCards;

            if (card1.dataset.value === card2.dataset.value && card1.dataset.index !== card2.dataset.index) {
                // تطابق صحيح
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedCount++;
                
                playMatchSound(); // تشغيل صوت الإجابة الصحيحة
                resetTurn();
                checkStageWin();
            } else {
                // لم يتطابقا: يعودان للوضع الطبيعي بعد ثانيتين تماماً
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    resetTurn();
                }, 2000);
            }
        }

        function resetTurn() {
            flippedCards = [];
            lockBoard = false;
        }

        function checkStageWin() {
            if (matchedCount === totalPairs) {
                setTimeout(() => {
                    playWinSound(); // تشغيل صوت اكتمال المرحلة
                    showWinModal();
                }, 600);
            }
        }

        function showWinModal() {
            const isLastStage = currentStageIndex === stages.length - 1;
            const title = document.getElementById('modal-title');
            const message = document.getElementById('modal-message');
            const btn = document.getElementById('next-stage-btn');

            if (isLastStage) {
                title.textContent = "🎉 مبروك الفوز النهائي! 🎉";
                message.textContent = "لقد أكملت كافة المراحل بنجاح وبكفاءة عالية!";
                btn.textContent = "إعادة اللعب من جديد";
            } else {
                title.textContent = "ممتاز جداً!";
                message.textContent = `تخطيت المرحلة ${stages[currentStageIndex].id} بنجاح.`;
                btn.textContent = "الانتقال للمرحلة التالية";
            }
            winModal.style.display = 'flex';
        }

        function nextStage() {
            winModal.style.display = 'none';
            if (currentStageIndex === stages.length - 1) {
                currentStageIndex = 0;
            } else {
                currentStageIndex++;
            }
            initGame();
        }
    </script>
</body>
</html>
