<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qsoom Focus Area</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* لوحة الألوان الفاتحة والمريحة */
    --bg-main: #f8fafc;
    --bg-container: #ffffff;
    --bg-hover: #f1f5f9;
    --bg-active: #e0f2fe;
    
    /* ألوان الهوية والاضاءة */
    --accent: #0284c7;       /* أزرق احترافي هادئ */
    --accent-glow: rgba(2, 132, 199, 0.08);
    --accent-2: #10b981;
    --accent-warn: #f59e0b;
    --accent-done: #10b981;
    --accent-danger: #ef4444;
    
    /* ألوان النصوص - درجات الرمادي الداكن */
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    
    /* الحدود والظلال */
    --border: #e2e8f0;
    --border-active: #bae6fd;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
    
    --radius: 12px;
    --radius-sm: 8px;
    
    /* خطوط مخصصة ومحسنة للويندوز */
    --font-sans: 'Tajawal', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    --font-mono: 'Consolas', 'DM Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg-main);
    color: var(--text-primary);
    font-family: var(--font-sans);
    min-height: 100vh;
    direction: rtl;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ─── HEADER ─── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    box-shadow: var(--shadow-sm);
  }
  .header-inner {
    max-width: 1100px; margin: 0 auto;
    display: flex; align-items: center;
    justify-content: space-between;
    height: 65px; gap: 12px;
  }
  .logo-container {
    display: flex; align-items: center;
    gap: 12px;
  }
  .logo {
    display: flex; align-items: center;
    flex-shrink: 0;
  }
  .logo img {
    height: 44px; width: auto;
    object-fit: contain;
  }
  /* اسم الصفحة المضاف بجانب الشعار */
  .brand-name {
    font-family: var(--font-sans);
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.5px;
    color: var(--accent);
    white-space: nowrap;
  }
  .header-stats-row {
    display: flex; gap: 8px; align-items: center;
    flex: 1; justify-content: flex-end;
  }
  .stat-chip {
    background: var(--bg-container); border: 1px solid var(--border);
    border-radius: 20px; padding: 6px 14px;
    font-size: 12px; color: var(--text-secondary);
    display: flex; align-items: center; gap: 6px;
    white-space: nowrap;
    box-shadow: var(--shadow-sm);
  }
  .stat-chip .chip-label { color: var(--text-muted); }
  .stat-chip span { color: var(--text-primary); font-weight: 700; }
   
  .header-clock {
    font-family: var(--font-mono); font-size: 12px; color: var(--accent);
    background: var(--accent-glow); border: 1px solid var(--border-active);
    border-radius: 8px; padding: 6px 14px; letter-spacing: 0.5px;
    white-space: nowrap; font-weight: 600;
  }

  /* ─── FOCUS BANNER ─── */
  #focus-banner {
    display: block;
    background: linear-gradient(135deg, #f0fdf4, #dcfce7); /* تدرج هادئ ومريح للمؤقت النشط */
    border: 1px solid #bbf7d0;
    border-radius: var(--radius);
    padding: 1.75rem 2rem;
    margin-bottom: 2rem;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-md);
    animation: slideIn 0.4s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
   
  .banner-label {
    font-size: 12px; color: var(--accent-done); font-family: var(--font-mono);
    letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px;
    font-weight: 600;
  }
  .banner-task { font-size: 24px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
  .banner-meta { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 16px; }
   
  #banner-timer {
    font-family: var(--font-mono); font-size: 42px; font-weight: 700;
    color: var(--accent-done); min-width: 120px;
  }
  #banner-timer.warning { color: var(--accent-warn); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
   
  .banner-progress {
    height: 6px; background: rgba(0,0,0,0.05);
    border-radius: 3px; margin-top: 16px; overflow: hidden;
  }
  .banner-progress-bar {
    height: 100%; background: linear-gradient(90deg, #10b981, #34d399);
    border-radius: 3px; transition: width 1s linear;
  }
   
  /* حالة الخمول للمؤقت */
  #focus-banner.idle {
    background: var(--bg-container);
    border-color: var(--border);
  }
  .banner-idle-content {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; padding: 1rem 0;
    color: var(--text-secondary);
  }
  .banner-idle-icon { font-size: 32px; opacity: 0.5; }
  .banner-idle-text { font-size: 16px; font-weight: 500; }

  /* ─── MAIN LAYOUT ─── */
  main {
    max-width: 1100px; margin: 0 auto;
    padding: 2rem;
    position: relative; z-index: 1;
  }

  /* ─── SUMMARY CARDS ─── */
  .summary-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    margin-bottom: 2.5rem;
  }
  .sum-card {
    background: var(--bg-container); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.25rem 1.5rem;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s ease;
  }
  .sum-card:hover { 
    transform: translateY(-2px);
    border-color: var(--border-active); 
    box-shadow: var(--shadow-md);
  }
  .sum-label { font-size: 12px; color: var(--text-secondary); font-weight: 500; margin-bottom: 8px; }
  .sum-val { font-size: 28px; font-weight: 800; font-family: var(--font-mono); }
  .sum-val.blue { color: var(--accent); }
  .sum-val.green { color: var(--accent-done); }
  .sum-val.amber { color: var(--accent-warn); }
  .sum-val.red { color: var(--accent-danger); }

  /* ─── TABLE SECTION ─── */
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.25rem;
  }
  .section-title {
    font-size: 15px; font-weight: 700; color: var(--text-primary);
    letter-spacing: 0.5px;
  }
  .filter-group { display: flex; gap: 8px; }
  .filter-btn {
    background: var(--bg-container); border: 1px solid var(--border);
    color: var(--text-secondary); border-radius: 8px; padding: 6px 14px;
    font-size: 13px; font-family: var(--font-sans); cursor: pointer;
    font-weight: 500; transition: all 0.15s;
    box-shadow: var(--shadow-sm);
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--accent-glow); border-color: var(--accent);
    color: var(--accent);
  }

  /* ─── TASK TABLE ─── */
  .task-table-wrap {
    background: var(--bg-container); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .task-table {
    width: 100%; border-collapse: collapse;
  }
  .task-table thead th {
    padding: 14px 18px; text-align: right;
    font-size: 12px; color: var(--text-secondary); font-weight: 600;
    border-bottom: 2px solid var(--border);
    background: var(--bg-main);
  }
  .task-table thead th:first-child { padding-right: 20px; }
   
  .task-row {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
    cursor: grab;
  }
  .task-row:last-child { border-bottom: none; }
  .task-row:hover { background: var(--bg-hover); }
   
  .task-row.active-task {
    background: var(--bg-active) !important;
    border-right: 4px solid var(--accent);
  }
  .task-row.active-task td { font-weight: 600; }
  .task-row.done-task { opacity: 0.6; background: #fafafa; }
  .task-row.done-task .task-name { text-decoration: line-through; color: var(--text-muted); }

  .task-table td {
    padding: 14px 18px; vertical-align: middle; font-size: 14px;
    color: var(--text-primary);
  }

  .drag-handle {
    color: var(--text-muted); cursor: grab; font-size: 16px; padding-left: 8px;
    user-select: none;
  }
  .drag-handle:hover { color: var(--text-secondary); }

  .task-name { font-weight: 500; }
  .task-name-edit {
    background: none; border: none; color: var(--text-primary);
    font-family: var(--font-sans); font-size: 14px; font-weight: 500;
    width: 100%; outline: none; border-bottom: 2px solid var(--accent);
    padding: 2px 4px;
  }

  .time-badge {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--accent-glow); border: 1px solid var(--border-active);
    color: var(--accent); border-radius: 6px;
    padding: 4px 10px; font-size: 12px; font-family: var(--font-mono);
    white-space: nowrap; font-weight: 500;
  }

  .status-badge {
    display: inline-flex; align-items: center; gap: 6px;
    border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: 500;
    white-space: nowrap;
  }
  .status-badge.not-started {
    background: #f1f5f9; color: var(--text-secondary);
    border: 1px solid #e2e8f0;
  }
  .status-badge.in-progress {
    background: var(--accent-glow); color: var(--accent);
    border: 1px solid var(--border-active);
  }
  .status-badge.paused {
    background: #fffbeb; color: var(--accent-warn);
    border: 1px solid #fde68a;
  }
  .status-badge.done {
    background: #ecfdf5; color: var(--accent-done);
    border: 1px solid #a7f3d0;
  }
   
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .dot.not-started { background: var(--text-muted); }
  .dot.in-progress { background: var(--accent); animation: blink 1.5s infinite; }
  .dot.paused { background: var(--accent-warn); }
  .dot.done { background: var(--accent-done); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .row-timer {
    font-family: var(--font-mono); font-size: 13px; color: var(--accent);
    min-width: 60px; display: inline-block; font-weight: 600;
  }
  .row-timer.done-timer { color: var(--accent-done); }

  .check-btn {
    background: var(--bg-container); border: 2px solid var(--border);
    width: 24px; height: 24px; border-radius: 50%;
    cursor: pointer; color: transparent; font-size: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .check-btn:hover { border-color: var(--accent-done); color: var(--accent-done); }
  .check-btn.checked { background: var(--accent-done); border-color: var(--accent-done); color: #fff; }

  /* ─── BUTTONS ─── */
  .btn-start {
    background: var(--accent); border: none; color: #fff;
    border-radius: 6px; padding: 6px 14px;
    font-size: 12px; font-weight: 600; font-family: var(--font-sans);
    cursor: pointer; transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 5px;
    width: 85px; justify-content: center;
    box-shadow: 0 2px 4px rgba(2, 132, 199, 0.2);
  }
  .btn-start:hover { background: #0369a1; transform: translateY(-1px); }

  .btn-stop {
    background: #fffbeb; border: 1px solid #fde68a;
    color: var(--accent-warn); border-radius: 6px; padding: 6px 14px;
    font-size: 12px; font-weight: 600; font-family: var(--font-sans);
    cursor: pointer; transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 5px;
    width: 85px; justify-content: center;
  }
  .btn-stop:hover { background: #fef3c7; }

  .btn-edit, .btn-delete {
    background: var(--bg-container); border: 1px solid var(--border);
    color: var(--text-secondary); border-radius: 6px; padding: 5px 10px;
    font-size: 12px; cursor: pointer; transition: all 0.15s;
    box-shadow: var(--shadow-sm);
  }
  .btn-edit:hover { border-color: var(--accent); color: var(--accent); }
  .btn-delete:hover { border-color: var(--accent-danger); color: var(--accent-danger); background: #fef2f2; }
  .btn-edit { margin-right: 4px; }

  /* ─── ADD TASK FORM ─── */
  .add-section {
    background: var(--bg-container); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.5rem 2rem;
    margin-top: 2rem;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.2s;
  }
  .add-section:focus-within { border-color: var(--border-active); box-shadow: var(--shadow-md); }
  .add-section-title {
    font-size: 14px; font-weight: 700; color: var(--text-primary);
    margin-bottom: 1rem; display: flex; align-items: center; gap: 8px;
  }
  .add-form-row {
    display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: end;
  }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
   
  .form-input, .form-select, .priority-select {
    background: var(--bg-main); border: 1px solid var(--border);
    color: var(--text-primary); border-radius: var(--radius-sm);
    padding: 10px 14px; font-size: 14px; font-family: var(--font-sans);
    outline: none; transition: all 0.2s;
    width: 100%;
  }
  .form-input:focus, .form-select:focus, .priority-select:focus { 
    border-color: var(--accent); 
    background: var(--bg-container);
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
  }
  .form-input::placeholder { color: var(--text-muted); }
  .form-select { min-width: 185px; }

  .btn-add {
    background: var(--accent-2); border: none; color: #fff;
    border-radius: 8px; padding: 10px 24px;
    font-size: 14px; font-weight: 700; font-family: var(--font-sans);
    cursor: pointer; transition: all 0.2s;
    white-space: nowrap; align-self: end;
    display: flex; align-items: center; gap: 6px;
    box-shadow: 0 2px 4px rgba(16, 185, 129, 0.2);
  }
  .btn-add:hover { background: #059669; transform: translateY(-1px); }
  .btn-add:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

  /* ─── TOAST & MODAL FITTINGS ─── */
  #toast {
    position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--bg-container); border: 1px solid var(--border);
    color: var(--text-primary); border-radius: 10px; padding: 14px 24px;
    font-size: 14px; z-index: 1000; transition: transform 0.3s ease;
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
    display: flex; align-items: center; gap: 10px; font-weight: 500;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.success { border-color: #a7f3d0; background: #f0fdf4; color: #15803d; }
  #toast.info { border-color: var(--border-active); background: #f0fdfa; color: #0369a1; }

  #completion-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(15, 23, 42, 0.3); backdrop-filter: blur(4px); z-index: 500;
    align-items: center; justify-content: center;
  }
  #completion-overlay.show { display: flex; animation: fadeIn 0.3s ease; }
  .completion-card {
    background: var(--bg-container); border: 1px solid var(--border);
    border-radius: 20px; padding: 3rem; text-align: center;
    max-width: 400px; width: 90%; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
  }
  .btn-close-modal {
    background: var(--accent-done); border: none; color: #fff; border-radius: 8px; padding: 12px 36px;
    font-size: 15px; font-weight: 700; font-family: var(--font-sans); cursor: pointer;
  }

  /* SOUND WAVE ANIMATION */
  .sound-wave { display: inline-flex; align-items: center; gap: 2px; margin-right: 6px; }
  .wave-bar { width: 3px; background: var(--accent); border-radius: 2px; animation: wave 0.8s ease infinite; }
  .wave-bar:nth-child(1) { height: 8px; animation-delay: 0s; }
  .wave-bar:nth-child(2) { height: 14px; animation-delay: 0.15s; }
  .wave-bar:nth-child(3) { height: 10px; animation-delay: 0.3s; }
  .wave-bar:nth-child(4) { height: 16px; animation-delay: 0.1s; }
  @keyframes wave { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.4); } }

  .priority-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-left: 6px; flex-shrink: 0; }
  .priority-high { background: var(--accent-danger); }
  .priority-med { background: var(--accent-warn); }
  .priority-low { background: var(--text-muted); }

  /* COL WIDTHS */
  .col-order { width: 40px; text-align: center; }
  .col-task { width: auto; min-width: 180px; }
  .col-time { width: 130px; }
  .col-status { width: 130px; }
  .col-counter { width: 90px; }
  .col-done { width: 60px; text-align: center; }
  .col-action { width: 90px; }
  .col-ops { width: 90px; text-align: center; }

  .footer-note { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 3rem; padding-bottom: 2rem; font-family: var(--font-mono); }
   
  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-main); }
  ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 4px; border: 2px solid var(--bg-main); }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo-container">
      <div class="logo">
        <img src="" alt="" />
      </div>
      <div class="brand-name">Qsoom Focus Area</div>
    </div>
    <div class="header-stats-row">
      <div class="stat-chip"><span class="chip-label">المهام المكتملة:</span> <span id="global-done-counter">0</span></div>
      <div class="stat-chip"><span class="chip-label">إجمالي الوقت:</span> <span id="global-time-counter">00:00:00</span></div>
      <div class="header-clock" id="header-clock">00:00:00 م</div>
    </div>
  </div>
</header>

</body>
</html>
