<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qasim Portfolio - Stable Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f1f5f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .book-container {
            perspective: 2000px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            padding: 40px 20px;
        }

        .book {
            width: 90%;
            max-width: 1000px;
            height: 600px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
        }

        .page {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-origin: left center;
            backface-visibility: hidden;
        }

        .page.flipped {
            transform: rotateY(-180deg);
        }

        .cover-page {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 40px;
        }

        .left-side {
            width: 60%;
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-left: 1px solid #e2e8f0;
        }

        .left-side img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .right-side {
            width: 40%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: white;
        }

        .corner-peel {
            position: absolute;
            width: 70px;
            height: 70px;
            cursor: pointer;
            z-index: 100;
        }

        .corner-next {
            bottom: 0;
            left: 0;
            background: linear-gradient(225deg, transparent 50%, rgba(59, 130, 246, 0.2) 50%, rgba(59, 130, 246, 0.5) 100%);
        }

        .corner-prev {
            bottom: 0;
            right: 0;
            background: linear-gradient(135deg, transparent 50%, rgba(148, 163, 184, 0.2) 50%, rgba(148, 163, 184, 0.5) 100%);
        }

        #loading {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        @media (max-width: 768px) {
            .book { height: 500px; }
            .page { flex-direction: column; }
            .left-side, .right-side { width: 100%; height: 50%; }
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>
        <p class="mt-4 font-bold text-slate-600">جاري تحميل المعرض...</p>
    </div>

    <header class="text-center py-6">
        <h1 class="text-3xl font-bold text-slate-800">Qasim Portfolio</h1>
        <p class="text-slate-500 mt-1">سجل أعمال تحليل البيانات</p>
    </header>

    <div class="book-container">
        <div id="book" class="book"></div>
    </div>

    <script>
        // رابط بيانات المشاريع (Google Sheets CSV)
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQSgvwhA6oY1ESj_I5_8nyWlpnpUll-xrUKUe16btvf7te5CX1_lsFOCx1PiQ4EP4WYtcuVHXsKvfsA/pub?output=csv";

        let projects = [];
        let currentPage = 0;

        function formatImageUrl(url) {
            if (!url) return "";
            if (url.includes("drive.google.com")) {
                const id = url.match(/\/d\/([^/]+)/)?.[1] || url.match(/id=([^&]+)/)?.[1];
                return id ? `https://lh3.googleusercontent.com/u/0/d/${id}` : url;
            }
            return url;
        }

        async function init() {
            try {
                const response = await fetch(CSV_URL);
                const text = await response.text();
                const rows = text.split('\n').slice(1);
                
                projects = rows.map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    return {
                        title: cols[0]?.replace(/"/g, ''),
                        desc: cols[1]?.replace(/"/g, ''),
                        img: formatImageUrl(cols[2]?.replace(/"/g, '').trim())
                    };
                }).filter(p => p.title);

                document.getElementById('loading').style.display = 'none';
                render();
            } catch (e) {
                console.error("Error loading data", e);
            }
        }

        function render() {
            const book = document.getElementById('book');
            book.innerHTML = '';

            // الغلاف
            const cover = document.createElement('div');
            cover.className = `page ${currentPage > 0 ? 'flipped' : ''}`;
            cover.style.zIndex = projects.length + 1;
            cover.innerHTML = `
                <div class="cover-page">
                    <h2 class="text-5xl font-bold mb-4">Portfolio</h2>
                    <p class="text-xl opacity-80">Qasim | Data Analyst</p>
                    ${currentPage === 0 ? '<div class="corner-peel corner-next" onclick="nextPage()"></div>' : ''}
                </div>
            `;
            book.appendChild(cover);

            // الصفحات
            projects.forEach((p, i) => {
                const pNum = i + 1;
                const page = document.createElement('div');
                page.className = `page ${pNum < currentPage ? 'flipped' : ''}`;
                page.style.zIndex = projects.length - i;
                
                const isCurrent = (pNum === currentPage);

                page.innerHTML = `
                    <div class="left-side">
                        <img src="${p.img}" alt="${p.title}" onerror="this.src='https://via.placeholder.com/600x400?text=No+Image'">
                    </div>
                    <div class="right-side">
                        <h3 class="text-2xl font-bold text-blue-700 mb-4">${p.title}</h3>
                        <p class="text-slate-600 leading-relaxed">${p.desc}</p>
                    </div>
                    ${isCurrent ? '<div class="corner-peel corner-prev" onclick="prevPage()"></div>' : ''}
                    ${isCurrent && pNum < projects.length ? '<div class="corner-peel corner-next" onclick="nextPage()"></div>' : ''}
                `;
                book.appendChild(page);
            });
        }

        function nextPage() { currentPage++; render(); }
        function prevPage() { currentPage--; render(); }

        window.onload = init;
    </script>
</body>
</html>
